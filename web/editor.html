<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>F1 Level Editor</title>
    <link rel="stylesheet" href="ui/ui.css">
</head>
<body>
    <!-- Level Editor -->
    <div id="level-editor" class="level-editor">
        <!-- Editor HUD Card (added by JS) -->
        <div id="editorHudCard"></div>
        
        <canvas id="editor-canvas" class="level-editor__canvas"></canvas>
        
        <nav id="level-editor-dock" class="ui-dock" data-align="bottom" role="toolbar" aria-label="Level Editor dock">
            <div class="ui-dock__items">
                <button type="button" class="ui-dock__button" disabled data-tool="pan" aria-label="Pan/Zoom Mode">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <img src="ui/icons/drag.png" alt="" width="24" height="24">
                    </span>
                    <span class="ui-dock__label">Pan/Zoom</span>
                    <span class="ui-dock__tooltip">Pan/Zoom [P]</span>
                </button>
                <button type="button" class="ui-dock__button" disabled data-tool="select" aria-label="Select Tool">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <img src="ui/icons/select.png" alt="" width="24" height="24">
                    </span>
                    <span class="ui-dock__label">Select</span>
                    <span class="ui-dock__tooltip">Select</span>
                </button>
                <button type="button" class="ui-dock__button" disabled data-tool="checkpoint" aria-label="Checkpoint Tool">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <img src="ui/icons/checkpoint.png" alt="" width="24" height="24">
                    </span>
                    <span class="ui-dock__label">Checkpoint</span>
                    <span class="ui-dock__tooltip">Checkpoint [C]</span>
                </button>
                <button type="button" class="ui-dock__button" disabled data-tool="start-finish" aria-label="Start/Finish Tool">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <img src="ui/icons/flag.png" alt="" width="24" height="24">
                    </span>
                    <span class="ui-dock__label">Start/Finish</span>
                    <span class="ui-dock__tooltip">Start/Finish [S]</span>
                </button>
                <button type="button" class="ui-dock__button" disabled data-tool="wall" aria-label="Wall Tool">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <img src="ui/icons/wall.png" alt="" width="24" height="24">
                    </span>
                    <span class="ui-dock__label">Wall</span>
                    <span class="ui-dock__tooltip">Wall</span>
                </button>
                <button type="button" class="ui-dock__button" disabled data-tool="delete" aria-label="Delete Tool">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <img src="ui/icons/delete.png" alt="" width="24" height="24">
                    </span>
                    <span class="ui-dock__label">Delete</span>
                    <span class="ui-dock__tooltip">Delete</span>
                </button>
                <button type="button" class="ui-dock__button" disabled data-tool="undo" aria-label="Undo">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <img src="ui/icons/undo.png" alt="" width="24" height="24">
                    </span>
                    <span class="ui-dock__label">Undo</span>
                    <span class="ui-dock__tooltip">Undo [Ctrl+Z]</span>
                </button>
                <button type="button" class="ui-dock__button" disabled data-tool="redo" aria-label="Redo">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <img src="ui/icons/redo.png" alt="" width="24" height="24">
                    </span>
                    <span class="ui-dock__label">Redo</span>
                    <span class="ui-dock__tooltip">Redo [Ctrl+Y]</span>
                </button>
                <button type="button" class="ui-dock__button" disabled data-tool="test" aria-label="Test Drive">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 16l2-5h10l2 5"></path>
                            <path d="M7 16h10"></path>
                            <path d="M5 16a2 2 0 1 0 0 4"></path>
                            <path d="M19 16a2 2 0 1 1 0 4"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Test Drive</span>
                    <span class="ui-dock__tooltip">Test Drive</span>
                </button>
                <button type="button" class="ui-dock__button" disabled data-tool="save" aria-label="Save Track">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <img src="ui/icons/save.png" alt="" width="24" height="24">
                    </span>
                    <span class="ui-dock__label">Save</span>
                    <span class="ui-dock__tooltip">Save [Enter]</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Utility modules -->
    <script src="utils.js" defer></script>

    <!-- UI helper modules -->
    <script src="ui/base.js" defer></script>
    <script src="ui/card.js" defer></script>
    <script src="ui/toggle-row.js" defer></script>
    <script src="ui/dock.js" defer></script>
    <script src="ui/dock-button.js" defer></script>
    <script src="ui/ui.js" defer></script>
    
    <!-- Level Editor module -->
    <script type="module" src="levelEditor.js"></script>
</body>
</html>
