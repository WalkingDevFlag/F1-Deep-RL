<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>F1 Manual Driving</title>
    <style>
        :root {
            --hud-bg: #f5f5f5;
            --hud-border: #1f1f1f;
            --hud-shadow: 4px 4px #1f1f1f;
            --hud-text: #222222;
            --hud-muted: #666666;
            --hud-accent: #2d8cf0;
            --hud-surface: #ffffff;
        }

        body { margin: 0; background: #fff; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { width: 100vw; height: 100vh; border: none; display: block; }

        .hud-card {
            position: absolute;
            top: 20px;
            left: 20px;
            padding: 18px 20px;
            width: 240px;
            background: var(--hud-bg);
            border: 2px solid var(--hud-border);
            border-radius: 6px;
            box-shadow: var(--hud-shadow);
            display: flex;
            flex-direction: column;
            gap: 14px;
            color: var(--hud-text);
            z-index: 10;
        }

        .hud-card h2 {
            margin: 0;
            font-size: 18px;
            font-weight: 700;
        }

        .hud-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            font-size: 15px;
        }

        .hud-label {
            font-weight: 600;
            color: var(--hud-text);
        }

        .hud-value {
            font-weight: 600;
            color: var(--hud-text);
        }

        .toggle-row {
            gap: 10px;
        }

        .toggle-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .hud-status {
            font-size: 13px;
            font-weight: 600;
            color: var(--hud-muted);
            min-width: 32px;
            text-align: right;
        }

        .switch {
            --input-focus: var(--hud-accent);
            --bg-color: var(--hud-surface);
            --main-color: var(--hud-border);
            position: relative;
            display: inline-flex;
            align-items: center;
            width: 52px;
            height: 24px;
        }

        .toggle {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            box-sizing: border-box;
            position: absolute;
            inset: 0;
            background-color: var(--hud-surface);
            border: 2px solid var(--hud-border);
            border-radius: 6px;
            box-shadow: 4px 4px var(--hud-border);
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .slider:before {
            content: "";
            position: absolute;
            height: 20px;
            width: 20px;
            left: -2px;
            bottom: 2px;
            background-color: var(--hud-surface);
            border: 2px solid var(--hud-border);
            border-radius: 6px;
            box-shadow: 0 3px 0 var(--hud-border);
            transition: transform 0.3s ease;
        }

        .toggle:checked + .slider {
            background-color: var(--hud-accent);
        }

        .toggle:checked + .slider:before {
            transform: translateX(30px);
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="hud-card" aria-label="Driver control panel">
        <h2>Driver Console</h2>
        <div class="hud-row">
            <span class="hud-label">FPS</span>
            <span id="hud-fps-value" class="hud-value">0</span>
        </div>
        <div class="hud-row">
            <span class="hud-label">Camera</span>
            <span id="hud-camera-value" class="hud-value">God's Eye View</span>
        </div>
        <div class="hud-row toggle-row">
            <span class="hud-label">Sensors</span>
            <div class="toggle-container">
                <span id="hud-sensors-status" class="hud-status">On</span>
                <label class="switch" aria-label="Toggle sensors">
                    <input class="toggle" type="checkbox" id="hud-sensors-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
        <div class="hud-row toggle-row">
            <span class="hud-label">Neural Net</span>
            <div class="toggle-container">
                <span id="hud-nn-status" class="hud-status">On</span>
                <label class="switch" aria-label="Toggle neural network visualisation">
                    <input class="toggle" type="checkbox" id="hud-nn-toggle" checked>
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>
    <!-- Utility modules -->
    <script src="utils.js"></script>
    
    <!-- Sensor module -->
    <script src="sensor.js"></script>
    
    <!-- Car module -->
    <script src="car.js"></script>
    
    <!-- Controls module -->
    <script src="controls.js"></script>
    
    <!-- Track module -->
    <script src="track.js"></script>
    
    <!-- Camera module -->
    <script src="camera.js"></script>
    
    <!-- Renderer module -->
    <script src="renderer.js"></script>
    
    <!-- Asset loader module -->
    <script src="assetLoader.js"></script>
    
    <!-- Main game logic -->
    <script src="main.js"></script>
</body>
</html>
