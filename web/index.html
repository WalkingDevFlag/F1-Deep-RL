<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>F1 Manual Driving</title>
    <link rel="stylesheet" href="ui/ui.css">
</head>
<body>
    <canvas id="canvas"></canvas>

    <nav id="main-dock" class="ui-dock" data-align="bottom" role="toolbar" aria-label="Simulator dock" data-persistent="true">
        <div class="ui-dock__items">
            <button type="button" class="ui-dock__button" data-dock-action="home" aria-label="Go to dashboard">
                <span class="ui-dock__icon" aria-hidden="true">
                    <img src="ui/icons/home.png" alt="" width="24" height="24">
                </span>
                <span class="ui-dock__label">Home</span>
                <span class="ui-dock__tooltip">Home</span>
            </button>
            <button type="button" class="ui-dock__button" data-dock-action="editor" aria-label="Open Level Editor">
                <span class="ui-dock__icon" aria-hidden="true">
                    <img src="ui/icons/edit.png" alt="" width="24" height="24">
                </span>
                <span class="ui-dock__label">Level Editor</span>
                <span class="ui-dock__tooltip">Level Editor</span>
            </button>
            <button type="button" class="ui-dock__button" data-dock-action="select-track" aria-label="Select Track">
                <span class="ui-dock__icon" aria-hidden="true">
                    <img src="ui/icons/flag.png" alt="" width="24" height="24">
                </span>
                <span class="ui-dock__label">Tracks</span>
                <span class="ui-dock__tooltip">Select Track</span>
            </button>
            <button type="button" class="ui-dock__button" data-dock-action="toggle-ui" aria-label="Toggle UI visibility">
                <span class="ui-dock__icon" aria-hidden="true">
                    <img src="ui/icons/eye-open.png" alt="" width="24" height="24">
                </span>
                <span class="ui-dock__label">Hide UI</span>
                <span class="ui-dock__tooltip">Hide UI</span>
            </button>
        </div>
    </nav>

    <div id="editor-modal" class="editor-modal" role="dialog" aria-modal="true" aria-labelledby="editor-modal-title" aria-describedby="editor-modal-description" aria-hidden="true" hidden>
        <section class="ui-card editor-modal__content" role="document" tabindex="-1">
            <button type="button" class="editor-modal__close" aria-label="Close editor modal" data-editor-close>&times;</button>
            <h2 class="ui-card__title" id="editor-modal-title">Create or Edit a Track</h2>
            <div class="ui-card__body">
                <p class="editor-modal__lead" id="editor-modal-description">Load an existing layout or upload a fresh build to start crafting your circuit.</p>
                <div class="editor-modal__actions">
                    <button type="button" class="editor-modal__action" data-editor-action="load">Load Existing</button>
                    <button type="button" class="editor-modal__action editor-modal__action--secondary" data-editor-action="upload">Upload New Track</button>
                </div>
                <p class="editor-modal__hint">Bring your best racing lines&mdash;the track builder is warming up.</p>
            </div>
        </section>
    </div>

    <div id="track-selector-modal" class="editor-modal" role="dialog" aria-modal="true" aria-labelledby="track-selector-modal-title" aria-hidden="true" hidden>
        <section class="ui-card editor-modal__content" role="document" tabindex="-1">
            <button type="button" class="editor-modal__close" aria-label="Close track selector" data-track-selector-close>&times;</button>
            <h2 class="ui-card__title" id="track-selector-modal-title">Select a Track</h2>
            <div class="ui-card__body">
                <p class="editor-modal__lead">Choose a circuit to load into the simulator.</p>
                <div class="editor-load__error" data-track-selector-error hidden></div>
                <div class="editor-load__list" data-track-selector-list>
                    <div class="editor-load__loading">Loading tracks...</div>
                </div>
            </div>
        </section>
    </div>

    <!-- Utility modules -->
            <div class="ui-dock__items">
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Select Tool">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 4l6 16 2-6 6 3z"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Select</span>
                    <span class="ui-dock__tooltip">Select</span>
                </button>
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Checkpoint Tool">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 4v16"></path>
                            <path d="M6 4h9l-3 4 4 3H6"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Checkpoint</span>
                    <span class="ui-dock__tooltip">Checkpoint</span>
                </button>
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Start/Finish Tool">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 4v16"></path>
                            <path d="M5 4h12"></path>
                            <path d="M5 10h12"></path>
                            <path d="M11 4v10"></path>
                            <path d="M17 4v10"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Start/Finish</span>
                    <span class="ui-dock__tooltip">Start/Finish</span>
                </button>
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Wall Tool">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="4" y="8" width="16" height="8" rx="2"></rect>
                            <path d="M8 8v8"></path>
                            <path d="M16 8v8"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Wall</span>
                    <span class="ui-dock__tooltip">Wall</span>
                </button>
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Delete Tool">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M6 7h12"></path>
                            <path d="M9 7V5h6v2"></path>
                            <path d="M8 7v12h8V7"></path>
                            <path d="M11 11v6"></path>
                            <path d="M13 11v6"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Delete</span>
                    <span class="ui-dock__tooltip">Delete</span>
                </button>
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Undo">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M9 8l-4 4 4 4"></path>
                            <path d="M5 12h9a5 5 0 1 1 0 10h-3"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Undo</span>
                    <span class="ui-dock__tooltip">Undo</span>
                </button>
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Redo">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15 8l4 4-4 4"></path>
                            <path d="M19 12h-9a5 5 0 1 0 0 10h3"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Redo</span>
                    <span class="ui-dock__tooltip">Redo</span>
                </button>
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Test Drive">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 16l2-5h10l2 5"></path>
                            <path d="M7 16h10"></path>
                            <path d="M5 16a2 2 0 1 0 0 4"></path>
                            <path d="M19 16a2 2 0 1 1 0 4"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Test Drive</span>
                    <span class="ui-dock__tooltip">Test Drive</span>
                </button>
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Save Track">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 5h12l2 3v11H5z"></path>
                            <path d="M9 5v6h6V5"></path>
                            <path d="M8 18h8"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Save</span>
                    <span class="ui-dock__tooltip">Save</span>
                </button>
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Export Track">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 3v12"></path>
                            <path d="M8 7l4-4 4 4"></path>
                            <path d="M5 15h14v6H5z"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Export</span>
                    <span class="ui-dock__tooltip">Export</span>
                </button>
                <button type="button" class="ui-dock__button level-editor__tool" disabled title="Exit Editor">
                    <span class="ui-dock__icon" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M10 4H5v16h5"></path>
                            <path d="M15 12H8"></path>
                            <path d="M15 12l3-3"></path>
                            <path d="M15 12l3 3"></path>
                        </svg>
                    </span>
                    <span class="ui-dock__label">Exit</span>
                    <span class="ui-dock__tooltip">Exit</span>
                </button>
            </div>
        </nav>
    </div>

    <!-- Utility modules -->
    <script src="utils.js" defer></script>
    
    <!-- Sensor module -->
    <script src="sensor.js" defer></script>
    
    <!-- Car module -->
    <script src="car.js" defer></script>
    
    <!-- Controls module -->
    <script src="controls.js" defer></script>
    
    <!-- Track module -->
    <script src="track.js" defer></script>
    
    <!-- Camera module -->
    <script src="camera.js" defer></script>
    
    <!-- Renderer module -->
    <script src="renderer.js" defer></script>
    
    <!-- Asset loader module -->
    <script src="assetLoader.js" defer></script>

    <!-- UI helper modules -->
    <script src="ui/base.js" defer></script>
    <script src="ui/card.js" defer></script>
    <script src="ui/stat-row.js" defer></script>
    <script src="ui/toggle-row.js" defer></script>
    <script src="ui/dock.js" defer></script>
    <script src="ui/dock-button.js" defer></script>
    <script src="ui/ui.js" defer></script>
    
    <!-- Level Editor module -->
    <script type="module" src="levelEditor.js"></script>
    
    <!-- Main game logic -->
    <script src="trainingController.js" defer></script>
    <script type="module" src="main.js"></script>
</body>
</html>
